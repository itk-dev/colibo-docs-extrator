version: "3"

vars:
  IMAGE: ghcr.io/aarhusai/colibo-docs-extrator
  TAG: '{{.TAG | default "latest"}}'
  BUILDER: colibo-docs-extrator-builder

tasks:
  default:
    desc: "List available tasks"
    cmds:
      - task --list-all
    silent: true

  build:
    desc: "Build image locally for the host arch"
    cmds:
      - docker build -t {{.IMAGE}}:{{.TAG}} .

  build:image:
    desc: "Build and push image to ghcr.io (multi-arch). Override PLATFORMS to build one arch (e.g. PLATFORMS=linux/amd64)."
    vars:
      PLATFORMS: '{{.PLATFORMS | default "linux/amd64,linux/arm64"}}'
    cmds:
      - task: build:image:builder
      - docker buildx build --builder {{.BUILDER}} --platform {{.PLATFORMS}} -t {{.IMAGE}}:{{.TAG}} --push .

  build:image:builder:
    desc: "Ensure the buildx builder and QEMU binfmt handlers exist (idempotent first-run setup)"
    internal: true
    silent: true
    cmds:
      - cmd: |
          if ! docker buildx inspect {{.BUILDER}} >/dev/null 2>&1; then
            echo "First-run setup: registering QEMU binfmt handlers (cross-arch emulation)..."
            docker run --privileged --rm tonistiigi/binfmt --install all
            echo "Creating buildx builder '{{.BUILDER}}' (docker-container driver)..."
            docker buildx create --name {{.BUILDER}} --driver docker-container --bootstrap
          fi

  run:
    desc: "Run the image with .env and sync.db mounted (pass arguments after --, e.g. task run -- sync --quiet)"
    cmds:
      - docker run --rm --volume "$PWD/.env:/app/.env" --volume "$PWD/sync.db:/app/sync.db" {{.IMAGE}}:{{.TAG}} {{.CLI_ARGS}}
